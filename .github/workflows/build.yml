name: build

# Reusable test-gated build for drwb Docker home-lab apps.
#
# Pattern:  test (PR + push) -> build (needs: test, main-push only).
# Optional `extra_branches` (e.g. "dev") also builds on a push to those branches,
# tagged with the branch name (`:dev`) instead of `:latest` — a second, separate
# environment that a watchtower-managed container can follow.
# Because `build` has `needs: test` and only runs on a green main push, the image
# tag `:latest` it publishes is, by definition, test-passed. The lab's existing
# watchtower then pulls `:latest` — an inherently gated deploy, no LAN infra needed.
#
# A red test skips `build`, so `:latest` never moves. That IS the deploy gate.
#
# Callers include this as a thin one-job workflow, e.g.:
#   jobs:
#     pipeline:
#       uses: drwb/ci-black/.github/workflows/build.yml@v1
#       with: { image: <app-a>, test_command: "uv run pytest -q" }
#       secrets: inherit
#
# Out of scope: Cloudflare Workers projects (they deploy on cloud runners directly).

on:
  workflow_call:
    inputs:
      image:
        description: "Short name -> ghcr.io/drwb/<image>. Use for single-image repos."
        type: string
        default: ""
      images:
        description: >-
          JSON array of {name,dockerfile,context} for multi-image repos.
          Overrides `image` when set. e.g.
          '[{"name":"<app-d>","dockerfile":"Dockerfile","context":"."},
            {"name":"<app-d>-tor","dockerfile":"deploy/Dockerfile.tor","context":"."}]'
        type: string
        default: ""
      test_command:
        description: "Test step (run after uv sync --frozen)."
        type: string
        default: "uv run pytest -q"
      lint_command:
        description: "Optional lint step; skipped when empty. e.g. 'uv run ruff check .'"
        type: string
        default: ""
      dockerfile:
        description: "Dockerfile path (single-image mode), relative to repo root."
        type: string
        default: "Dockerfile"
      context:
        description: "Build context (single-image mode)."
        type: string
        default: "."
      platforms:
        description: "Build platforms."
        type: string
        default: "linux/amd64"
      cache_paths:
        description: >-
          Optional extra paths to cache in the test job (one per line),
          e.g. "~/.cache/ms-playwright" for browser tests. Skipped when empty.
        type: string
        default: ""
      cache_key_files:
        description: "Glob(s) whose hash keys the cache_paths cache (e.g. uv.lock, which pins tool versions)."
        type: string
        default: "uv.lock"
      extra_branches:
        description: >-
          Optional comma-separated branches (no spaces) that also publish on push,
          tagged :<branch> (never :latest). e.g. "dev". Empty = main only.
        type: string
        default: ""

jobs:
  # Runs on PRs and pushes — the branch-protection signal. Red here blocks build.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          enable-cache: true
      - name: Restore extra caches
        if: ${{ inputs.cache_paths != '' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ inputs.cache_paths }}
          key: ${{ runner.os }}-extra-${{ hashFiles(inputs.cache_key_files) }}
      - run: uv sync --frozen
      - name: Lint
        if: ${{ inputs.lint_command != '' }}
        run: ${{ inputs.lint_command }}
      - name: Test
        run: ${{ inputs.test_command }}

  # Normalises single-image vs multi-image inputs into one build matrix.
  # Gated here: only a push to main (or to an `extra_branches` branch) reaches
  # build. PRs stop after `test`.
  prep:
    needs: test
    if: >-
      ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' ||
      (inputs.extra_branches != '' &&
       contains(format(',{0},', inputs.extra_branches), format(',{0},', github.ref_name)))) }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          IMAGE: ${{ inputs.image }}
          IMAGES: ${{ inputs.images }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.context }}
        run: |
          set -euo pipefail
          if [ -n "$IMAGES" ]; then
            matrix="$(printf '%s' "$IMAGES" | jq -c '{include: .}')"
          elif [ -n "$IMAGE" ]; then
            matrix="$(jq -cn --arg n "$IMAGE" --arg d "$DOCKERFILE" --arg c "$CONTEXT" \
              '{include: [{name: $n, dockerfile: $d, context: $c}]}')"
          else
            echo "::error::Provide either 'image' or 'images' input."; exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: prep
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJSON(needs.prep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        id: meta
        with:
          images: ghcr.io/drwb/${{ matrix.name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The commit being built, for Dockerfiles that declare `ARG GIT_SHA`
          # (e.g. to report it from a health endpoint so a post-deploy check can
          # wait for exactly this build). Unused by a Dockerfile = a BuildKit
          # warning, nothing more.
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
